# Dependency updates for the marketing site. There are no GitHub Actions
# workflows in this repo (Vercel builds it); add a `github-actions` entry if one
# is ever introduced, with actions pinned to commit SHAs.
version: 2
updates:
  - package-ecosystem: npm # covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version is usually caught upstream first. Security updates are
    # not delayed by this.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
